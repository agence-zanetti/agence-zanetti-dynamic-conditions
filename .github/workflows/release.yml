name: Publier la release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Lire et vérifier le numéro de version
        id: version
        run: |
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' agence-zanetti-dynamic-conditions.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "AZDC_VERSION'" agence-zanetti-dynamic-conditions.php | sed -E "s/.*AZDC_VERSION',\s*'([^']+)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//' | tr -d '[:space:]')
          echo "En-tête : $HEADER / constante : $CONST / readme.txt : $STABLE"
          if [ -z "$HEADER" ] || [ "$HEADER" != "$CONST" ] || [ "$HEADER" != "$STABLE" ]; then
            echo "::error::Les numéros de version ne correspondent pas (en-tête, AZDC_VERSION, Stable tag)."
            exit 1
          fi
          if ! grep -q "^## $HEADER\$" CHANGELOG.md; then
            echo "::error::La section « ## $HEADER » est absente de CHANGELOG.md."
            exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"

      - name: Installer PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Vérifier la syntaxe PHP 7.4
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Installer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Vérifier la syntaxe PHP 8.4
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Vérifier si la release existe déjà
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release v${{ steps.version.outputs.version }} existe déjà : rien à publier."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fabriquer le zip du plugin
        if: steps.exists.outputs.exists == 'false'
        run: |
          mkdir -p build/agence-zanetti-dynamic-conditions
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude 'tests' ./ build/agence-zanetti-dynamic-conditions/
          cd build
          zip -rq agence-zanetti-dynamic-conditions.zip agence-zanetti-dynamic-conditions
          unzip -l agence-zanetti-dynamic-conditions.zip

      - name: Publier la release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          gh release create "v$VERSION" build/agence-zanetti-dynamic-conditions.zip \
            --title "Version $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
